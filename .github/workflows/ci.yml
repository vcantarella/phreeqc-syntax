name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package # re-runs the checks via vscode:prepublish, then builds the .vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
